<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sigaa-Calendar</title>
</head>
<body>
    <h2>Sincronize seu SIGAA</h2>
    
    <form action="/sincronizar" method="POST">
        <label>Usuário do SIGAA:</label><br>
        <input type="text" name="usuario" required><br><br>
        
        <label>Senha:</label><br>
        <input type="password" name="senha" required><br><br>
        
        <label>O que sincronizar?</label><br>
        <input type="checkbox" name="tarefas" value="true" checked> Tarefas (Google Tasks)<br>
        <input type="checkbox" name="aulas" value="true"> Aulas (Google Agenda)<br><br>
        
        <button type="submit">Sincronizar Agora</button>
    </form>
</body>
</html>
